[build]
rustflags = [
    # `--cfg tokio_unstable` is required by the `console-subscriber` example
    # (multithreading.rs).
    #
    # NOTE: `-Awarnings` was removed deliberately (2026-08-25, add-ci-checks) so the
    # workspace lints in the root Cargo.toml are actually visible. CI now gates on
    # `clippy -- -D warnings` with a single temporary exception: `missing-docs` is
    # `allow` in the workspace lints until the docs pass lands. See
    # .agents/notes/proposed/process/2026-08-25-fix-warning-backlog.md.
    "--cfg", "tokio_unstable"
]
