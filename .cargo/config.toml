[build]
rustflags = [
    # `--cfg tokio_unstable` is required by the `console-subscriber` example
    # (multithreading.rs).
    #
    # NOTE: `-Awarnings` was removed deliberately (2026-08-25, add-ci-checks) so the
    # workspace lints in the root Cargo.toml are actually visible. The tree is not yet
    # warning-clean: ~420 rustc/clippy warnings remain (mostly unused imports from the
    # crate splits). CI gates on `clippy -D clippy::correctness` only until the cleanup
    # lands; removing them is tracked as a follow-up.
    "--cfg", "tokio_unstable"
]
