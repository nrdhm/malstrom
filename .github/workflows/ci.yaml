name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # The tree is not yet warning-clean (~420 rustc/clippy warnings remain from the
      # crate splits), so the clippy gate is scoped to the correctness group; the
      # workspace lints already deny it. Widening to `-D warnings` is tracked as a
      # follow-up (see .cargo/config.toml and the fix-warning-backlog note).
      #
      # `malstrom-k8s` (the runtime crate) is excluded: its build.rs runs
      # `tonic_build::compile_protos`, which needs `protoc`, and CI runners do not
      # install it. Re-enabling it (install protoc, or vendor it) is tracked in the
      # point-k8s-and-kafka-at-local-malstrom note.
      - name: Clippy (correctness)
        run: cargo clippy --workspace --exclude malstrom-k8s --all-targets -- -D clippy::correctness

      - name: Check
        run: cargo check --workspace --exclude malstrom-k8s --all-targets

      - name: Test
        run: cargo test --workspace --exclude malstrom-k8s
