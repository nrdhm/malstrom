name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # `malstrom-k8s-proto` compiles the shared gRPC protos (exchange.proto +
      # k8s_operator_api.proto) with tonic_build in its build.rs, which needs a
      # `protoc` binary — CI runners do not provide one, so install it and keep the
      # whole workspace in the gate (no exclusions; all k8s crates are first-class
      # parts of the repo).
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # The tree is not yet warning-clean (~420 rustc/clippy warnings remain from the
      # crate splits), so the clippy gate is scoped to the correctness group; the
      # workspace lints already deny it. Widening to `-D warnings` is tracked as a
      # follow-up (see .cargo/config.toml and the fix-warning-backlog note).
      - name: Clippy (correctness)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace
