[workspace]
resolver = "2"
members = [
    "malstrom",
    "malstrom-core",
    "malstrom-examples",
    "malstrom-distributed",
    "malstrom-operators",
    "malstrom-testkit",
    "malstrom-snapshot-slatedb",
    "malstrom-k8s/artifact-downloader",
    "malstrom-k8s/artifact-manager",
    "malstrom-k8s/operator",
    "malstrom-k8s/operator/crds",
    "malstrom-k8s/proto",
    "malstrom-k8s/runtime",
    "malstrom-kafka",
    "malstrom-macros",
]

[workspace.lints.rust]
missing-docs = "warn"
# Step 0 (see .agents/notes/proposed/process/2026-08-25-fix-warning-backlog.md): every
# lint that currently fires is explicitly `allow`ed so the widened `-D warnings` gate is
# green from the start. Each line is removed as its group is cleaned up; the final state has
# no lint rules ignored.
async_fn_in_trait = "allow"
dead_code = "allow"
private_interfaces = "allow"
refining_impl_trait_reachable = "allow"

[workspace.lints.clippy]
# `correctness` stays denied by policy (the add-ci-checks gate).
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
cargo = "warn"
# Step 0: lints currently firing, explicitly allowed until their group is cleaned.
# `priority = 1` keeps them from conflicting with their enabling group (lint_groups_priority).
unwrap_used = {level = "allow", priority = 1}
module_inception = {level = "allow", priority = 1}
multiple_crate_versions = {level = "allow", priority = 1}
too_many_arguments = {level = "allow", priority = 1}
wrong_self_convention = {level = "allow", priority = 1}
new_without_default = {level = "allow", priority = 1}
type_complexity = {level = "allow", priority = 1}
await_holding_refcell_ref = {level = "allow", priority = 1}
