[package]
name = "malstrom-core"
version = "0.1.0"
edition = "2024"
description = "Malstrom is a distributed, stateful stream processing framework written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MalstromDevelopers/malstrom"
readme = "../README.md"
categories = [
    "concurrency",
]
keywords = [
    "stream",
    "data",
    "framework",
    "streaming",
    "distributed",
]

[lints]
workspace = true

# [features]
# Exposes `malstrom_core::test_support` (logging helpers) to integration tests
# and downstream crates. Not part of the public API for normal builds.
# test-support = ["dep:tracing-subscriber"]

[dependencies]
itertools = "0.11.0"
serde = { version = "1.0.218", features = ["derive"] }
thiserror = "1.0.49"

log = { version = "0.4", features = [
    "max_level_trace",
    # "max_level_off",
    "release_max_level_info",
] }
tracing = { version = "0.1.40", features = [
    "log",
    "max_level_trace",
    # "max_level_off",
    "release_max_level_info"
] }
indexmap = { version = "2.1.0", features = ["serde"] }

tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "rt", "sync", "time"] }
rmp-serde = "1.3.0"
seahash = "4.1.0"
bon = "3.3.2"
async-trait = "0.1.85"
futures = "0.3.31"
flume = "0.11.1"
malstrom-macros = { path = "../malstrom-macros"}
pin-project = "1.1.10"

[dev-dependencies]
proptest = "1.5.0"
# Self-dependency: enables the `test-support` feature for this package's own
# unit and integration tests.
# malstrom-core = { path = ".", features = ["test-support"] }
malstrom-testkit = { path = "../malstrom-testkit/"}
