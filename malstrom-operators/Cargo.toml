[package]
name = "malstrom-operators"
version = "0.1.0"
edition = "2024"
description = "User-facing operators, sinks and sources for Malstrom jobs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MalstromDevelopers/malstrom"

[lints]
workspace = true

[dependencies]
malstrom-core = { path = "../malstrom-core" }
malstrom-distributed = { path = "../malstrom-distributed" }
expiremap = { version="0.1.0-beta.3", features = ["serde"] }
rand = "0.9.2"
serde = { version = "1.0.218", features = ["derive"] }
futures = "0.3.31"
indexmap = { version = "2.1.0", features = ["serde"] }
itertools = "0.11.0"
tokio = { version = "1.47.1", features = ["sync", "macros", "rt"] }
tracing = { version = "0.1.40", features = ["log"] }
seahash = "4.1.0"
thiserror = "1.0.49"
malstrom-macros = { path = "../malstrom-macros" }

[dev-dependencies]
malstrom-testkit = { path = "../malstrom-testkit" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
