[package]
name = "malstrom"
version = "0.2.0"
edition = "2024"
description = "Malstrom is a distributed, stateful stream processing framework written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MalstromDevelopers/malstrom"
readme = "../README.md"
categories = [
    "concurrency",
]
keywords = [
    "stream",
    "data",
    "framework",
    "streaming",
    "distributed",
]

[lints]
workspace = true

[dependencies]
malstrom-core = { path = "../malstrom-core" }
malstrom-combinators = { path = "../malstrom-combinators", optional = true }
malstrom-distributed = { path = "../malstrom-distributed", optional = true }
malstrom-snapshot-slatedb = { path = "../malstrom-snapshot-slatedb", optional = true }

[features]
default = ["combinators", "distributed"]
combinators = ["dep:malstrom-combinators"]
distributed = ["dep:malstrom-distributed", "combinators"]
slatedb = ["dep:malstrom-snapshot-slatedb"]
