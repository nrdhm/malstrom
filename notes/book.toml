[book]
title = "Malstrom Agent Notes"
authors = ["Malstrom Developers"]
description = "Repository-internal decision records: proposed, implemented, rejected, archived."
language = "en"
# `src` is GENERATED by `dev.sh` (a copy of `.agents/notes` plus a generated
# `SUMMARY.md`); it is git-ignored and never committed. See dev.sh.
src = "src"

[build]
build-dir = "book"

[output.html]
# `mermaid-init.js` is the shared, committed copy in `../mdbook/` (both books are
# byte-identical otherwise). `mermaid.min.js` is the git-ignored vendored asset.
additional-js = ["mermaid.min.js", "../mdbook/mermaid-init.js"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.search]
enable = true