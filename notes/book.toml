[book]
title = "Malstrom Agent Notes"
authors = ["Malstrom Developers"]
description = "Repository-internal decision records: proposed, implemented, rejected, archived."
language = "en"
# `src` is GENERATED by `dev.sh` (a copy of `.agents/notes` plus a generated
# `SUMMARY.md`); it is git-ignored and never committed. See dev.sh.
src = "src"

[build]
build-dir = "book"

[output.html]
# `mermaid-init.js` is a symlink to the shared, committed copy in `../mdbook/`
# (both books used byte-identical files). `mermaid.min.js` is the git-ignored
# vendored asset. `mdbook-mermaid install` skips existing files, so the symlink
# survives a fresh install.
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.search]
enable = true